# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - capital-explorer-sbm

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Build server
        run: |
          cd server
          npm ci
          npm run build

      - name: Verify math engine (client's regression tests)
        run: |
          cd client
          npm ci
          npm run verify

      - name: Build client
        run: |
          cd client
          npm run build

      - name: Assemble deployment package
        run: |
          mkdir -p deploy/server deploy/client
          cp -r server/dist deploy/server/dist
          cp -r server/node_modules deploy/server/node_modules
          cp server/package.json deploy/server/package.json
          cp -r client/dist deploy/client/dist

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_F401657C23BD45B7B610B863B0E01E05 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D329056D72A74149B111066DFCC479F2 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_55AF363B7FFE409F810734D8499B7446 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'capital-explorer-sbm'
          slot-name: 'Production'
          package: .
          