name: Deploy to Azure

on:
  push:
    branches: [master]
  workflow_dispatch: {}

env:
  AZURE_WEBAPP_NAME: capital-explorer-sbm

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build server
        run: |
          cd server
          npm ci
          npm run build

      - name: Build client
        run: |
          cd client
          npm ci
          npm run build

      - name: Assemble deployment package
        run: |
          mkdir -p deploy/server deploy/client
          cp -r server/dist deploy/server/dist
          cp -r server/node_modules deploy/server/node_modules
          cp server/package.json deploy/server/package.json
          cp -r client/dist deploy/client/dist

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: deploy
